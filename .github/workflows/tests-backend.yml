name: backend tests

# Runs the pytest suite under tests/. Tests that depend on db.sqlite, the
# parsed corpus, or a live :8000 backend self-skip when those assets aren't
# present, so CI exercises the offline subset (api smoke via TestClient,
# verifier regex paths, dedupe/meta/projection/anchor logic, etc.).

on:
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**.md'
      - 'deploy/**'
  push:
    branches: [dev]
    paths-ignore:
      - 'web/**'
      - 'docs/**'
      - '**.md'
      - 'deploy/**'
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: install python
        run: uv python install 3.11

      - name: sync deps (incl. dev)
        run: uv sync --extra dev

      - name: pytest
        run: uv run pytest -q tests/
