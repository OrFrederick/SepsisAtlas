openapi: 3.1.0
info:
  title: Sepsis Atlas Tools
  version: 0.1.0
  description: |
    Three OpenAPI tools used by Open WebUI to render bbox-anchored PDF spans,
    forest-plot meta-analysis panels, and PubMed-expansion progress as iframe
    artifacts in the chat UI.

    All endpoints return `text/html` decorated with `X-OpenWebUI-Artifact: true`
    so the Open WebUI artifact router routes them to the side pane (or, on
    older builds, inlines the iframe via the chat HTML renderer).

servers:
  - url: http://open_source:9101
    description: open_source tool server
  - url: http://meta_analyze:9102
    description: meta_analyze tool server
  - url: http://expand_pubmed:9103
    description: expand_pubmed tool server

paths:
  /open_source:
    get:
      operationId: open_source
      summary: Open the cited PDF page with the bounding box highlighted
      description: |
        Returns an HTMLResponse containing an iframe that loads the backend
        PDF.js viewer at `/viewer/<file_stem>?page=&bbox=`. The iframe uses
        `sandbox="allow-scripts allow-same-origin"`. The Open WebUI setting
        "Allow Iframe Sandbox Same-Origin Access" must be enabled for the
        viewer to render.
      parameters:
        - in: query
          name: file_stem
          required: true
          schema: {type: string, example: "Gai_2022"}
        - in: query
          name: page
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: bbox
          required: false
          schema: {type: string, example: "120.4,532.1,488.2,571.8"}
          description: PDF-points bbox `x0,y0,x1,y1`
        - in: query
          name: row_id
          required: false
          schema: {type: string}
      responses:
        "200":
          description: HTML iframe wrapper for the PDF viewer
          content:
            text/html:
              schema: {type: string}
  /open_source/by_row:
    get:
      operationId: open_source_by_row
      summary: Resolve a row id to its anchor and open the source page
      parameters:
        - in: query
          name: row_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: HTML iframe wrapper
          content:
            text/html:
              schema: {type: string}

  /meta_analyze:
    post:
      operationId: meta_analyze
      summary: Pool effect sizes across selected rows; render forest plot panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [row_ids]
              properties:
                row_ids:
                  type: array
                  items: {type: string}
                  description: row ids from the predictor_model table
                method:
                  type: string
                  enum: [random_effects, fixed_effects]
                  default: random_effects
                label:
                  type: string
                  description: Display title for the artifact
      responses:
        "200":
          description: HTML panel with embedded forest plot + pooled estimate
          content:
            text/html:
              schema: {type: string}

  /expand_pubmed:
    post:
      operationId: expand_pubmed
      summary: Ingest PubMed papers matching a query into the corpus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: "septic shock 28-day mortality lactate"
                max_results:
                  type: integer
                  minimum: 1
                  maximum: 200
                  default: 20
                year_min:
                  type: integer
                  nullable: true
                job_id:
                  type: string
                  nullable: true
                  description: If set, polls progress on an existing job instead
      responses:
        "200":
          description: HTML progress panel
          content:
            text/html:
              schema: {type: string}
