# Production override.
#
# Applied with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -p atlas-main up -d --build
#
# Differences from dev compose:
#   - Backend bound to loopback only (Caddy on the host proxies in front)
#   - Dev source-code volume mount is replaced with the prod set (no hot reload)
#   - Neo4j has no published ports (only reachable inside the compose network)

services:
  backend:
    volumes: !override
      - ./data:/app/data
      - ./db.sqlite:/app/db.sqlite
      - ./static:/app/static
      - ./runs:/app/runs
      - ./logs:/app/logs
    ports: !override
      - "127.0.0.1:8000:8000"

  neo4j:
    ports: !override []
