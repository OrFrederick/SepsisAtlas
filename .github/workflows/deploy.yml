name: deploy main

# On every push to main (except docs-only):
#   1. build + push backend image to ghcr (~30s warm via gha cache when
#      no backend files changed; ~10min cold if the cache is evicted or
#      the Dockerfile changes a layer)
#   2. build + push frontend image to ghcr (same cache characteristics)
#
# Watchtower on the VPS polls ghcr every 5 minutes and restarts the
# matching container when a new :main tag lands, so this workflow does
# not need to trigger anything on the VPS directly.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Hardcoded lowercase — docker tags reject mixed-case (`OrFrederick`).
  # Keep in sync with `image:` in docker-compose.prod.yml.
  BACKEND_IMAGE: ghcr.io/orfrederick/sepsis-atlas-backend
  FRONTEND_IMAGE: ghcr.io/orfrederick/sepsis-atlas-frontend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # network=host so the buildkit container can reach docker.io when
          # running under `act` on a Colima-backed daemon (isolated network
          # otherwise times out the base-image fetch). Harmless on real CI
          # runners where the host net is already in use.
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:main
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:main
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
