name: frontend tests

# Typecheck + vitest for the Next.js app under web/.
#
# Unlike the deploy workflow, we do NOT pass `--ignore-scripts` here. vitest
# pulls in vite -> rollup, and rollup loads a platform-native package at
# runtime (`@rollup/rollup-linux-x64-gnu` on this runner). bun.lock only pins
# the optional dep for whichever OS the lockfile was generated on, so the
# Linux variant is only fetched when the install's postinstall scripts run.
# Blocking them surfaces as `Cannot find module '@rollup/rollup-linux-x64-gnu'`
# the moment vitest boots.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'web/**'
      - '.github/workflows/tests-frontend.yml'
  push:
    branches: [dev]
    paths:
      - 'web/**'
      - '.github/workflows/tests-frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # setup-bun does not cache packages. Cache both the resolved
      # node_modules tree and bun's global download cache. On a hit with
      # an unchanged bun.lock, `bun install --frozen-lockfile` becomes
      # effectively a no-op.
      - name: cache bun deps
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run check

      - name: vitest
        run: bun run test
