name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_data_only:
        description: "Re-export JSON only; skip Astro build (uses last built dist)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install SQLAlchemy

      - name: Export static JSON from SQLite
        run: python scripts/export_static.py --db db.sqlite --out-dir web/public

      - name: Set up Node
        if: ${{ github.event.inputs.publish_data_only != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install npm deps
        if: ${{ github.event.inputs.publish_data_only != 'true' }}
        working-directory: web
        run: npm ci

      - name: Build Astro site
        if: ${{ github.event.inputs.publish_data_only != 'true' }}
        working-directory: web
        run: npm run build

      - name: Refresh JSON in existing dist (publish-data-only mode)
        if: ${{ github.event.inputs.publish_data_only == 'true' }}
        run: |
          if [ ! -d web/dist ]; then
            echo "web/dist not found; cannot publish-data-only without a prior full build."
            exit 1
          fi
          cp -R web/public/. web/dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
