<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sepsis Atlas</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --panel-2: #11141b;
    --border: #2a2f3a;
    --border-strong: #ffd23f;
    --fg: #e7e9ee;
    --fg-muted: #8c93a6;
    --fg-soft: #cfd2da;
    --accent: #ffd23f;
    --link: #7cc5ff;
    --ok: #4ade80;
    --warn: #fbbf24;
    --fail: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
  }
  textarea {
    font-family: inherit;
    font-size: inherit;
    color: inherit;
  }
  #app {
    display: grid;
    grid-template-rows: 40px 1fr;
    height: 100vh;
    width: 100vw;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    height: 40px;
  }
  .brand {
    font-weight: 600;
    letter-spacing: 0.2px;
    color: var(--fg);
  }
  .brand .dot {
    color: var(--accent);
    margin-right: 6px;
  }
  .subtitle {
    color: var(--fg-muted);
    font-size: 12px;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .clear-btn {
    color: var(--fg-muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
    transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
  }
  .clear-btn:hover {
    color: var(--fg);
    border-color: var(--fg-muted);
    background: var(--panel);
  }
  .split {
    display: grid;
    grid-template-columns: 480px 1px 1fr;
    height: 100%;
    overflow: hidden;
  }
  .divider {
    background: var(--border);
    width: 1px;
    height: 100%;
  }
  .chat {
    display: flex;
    flex-direction: column;
    background: var(--panel-2);
    overflow: hidden;
  }
  .scrollback {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .scrollback::-webkit-scrollbar {
    width: 8px;
  }
  .scrollback::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  .turn {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble-user {
    align-self: flex-end;
    max-width: 85%;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-right: 2px solid var(--accent);
    border-radius: 8px;
    color: var(--fg);
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .assistant {
    align-self: flex-start;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    animation: fadeIn 120ms ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .summary {
    color: var(--fg-soft);
    padding: 4px 2px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .refused {
    color: var(--fg-muted);
    font-style: italic;
    padding: 4px 2px;
  }
  .thinking {
    color: var(--fg-muted);
    font-style: italic;
    padding: 4px 2px;
  }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 120ms ease, transform 100ms ease, background 120ms ease;
    outline: none;
  }
  .card:hover {
    background: #1c2029;
  }
  .card:focus-visible {
    border-color: var(--accent);
  }
  .card.active {
    border-color: var(--border-strong);
  }
  .card.tap {
    transform: scale(0.985);
  }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .card-title {
    color: var(--fg);
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .card-meta-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .page {
    color: var(--fg-muted);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
  }
  .badge.ok   { background: rgba(74, 222, 128, 0.15); color: var(--ok); }
  .badge.warn { background: rgba(251, 191, 36, 0.15); color: var(--warn); }
  .badge.fail { background: rgba(248, 113, 113, 0.15); color: var(--fail); }
  .badge.unk  { background: rgba(140, 147, 166, 0.15); color: var(--fg-muted); }
  .kv {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
    margin-top: 4px;
  }
  .kv .k {
    color: var(--fg-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .kv .v {
    color: var(--fg-soft);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .kv .row { min-width: 0; }
  .quote {
    margin-top: 8px;
    color: var(--fg-muted);
    font-style: italic;
    font-size: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    border-left: 2px solid var(--border);
    padding-left: 8px;
  }
  .composer {
    border-top: 1px solid var(--border);
    background: var(--panel-2);
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .composer textarea {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    resize: none;
    min-height: 36px;
    max-height: 132px;
    overflow-y: auto;
    line-height: 1.4;
    outline: none;
  }
  .composer textarea:focus {
    border-color: var(--accent);
  }
  .send-btn {
    background: var(--accent);
    color: #1a1a1a;
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    transition: opacity 120ms ease, transform 100ms ease;
  }
  .send-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .send-btn:not(:disabled):hover {
    transform: translateY(-1px);
  }
  .viewer {
    height: 100%;
    background: var(--bg);
    position: relative;
  }
  .viewer iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--bg);
  }
  .viewer-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-muted);
    padding: 40px;
    text-align: center;
  }
  .welcome {
    margin: auto;
    max-width: 380px;
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-align: center;
  }
  .welcome h2 {
    margin: 0 0 8px;
    color: var(--accent);
    font-size: 16px;
    letter-spacing: 0.3px;
  }
  .welcome p {
    margin: 0 0 14px;
    color: var(--fg-soft);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .chip {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--fg-soft);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 11.5px;
    cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .chip:hover {
    border-color: var(--accent);
    color: var(--fg);
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="dot">&#9670;</span>Sepsis Atlas</div>
    <div class="topbar-right">
      <span class="subtitle">Evidence-anchored sepsis Q&amp;A</span>
      <button id="clearBtn" class="clear-btn" type="button" title="Clear chat history">Clear chat</button>
    </div>
  </header>
  <main class="split">
    <section class="chat">
      <div id="scrollback" class="scrollback"></div>
      <form id="composer" class="composer" autocomplete="off">
        <textarea id="input" rows="1" placeholder="Ask about sepsis predictors, biomarkers, or outcomes..."></textarea>
        <button id="send" class="send-btn" type="submit">Send</button>
      </form>
    </section>
    <div class="divider"></div>
    <section class="viewer" id="viewer">
      <div class="viewer-empty" id="viewerEmpty">Click an evidence row to view the source PDF.</div>
      <iframe id="viewerFrame" style="display:none" title="PDF viewer"></iframe>
    </section>
  </main>
</div>
<script>
(function () {
  "use strict";

  var HISTORY_KEY = "sepsis_atlas.history.v1";
  var VIEWER_KEY = "sepsis_atlas.last_viewer_url.v1";
  var HISTORY_MAX = 50;

  var scrollback = document.getElementById("scrollback");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var form = document.getElementById("composer");
  var viewerFrame = document.getElementById("viewerFrame");
  var viewerEmpty = document.getElementById("viewerEmpty");
  var activeCard = null;

  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt !== undefined && txt !== null) n.textContent = String(txt);
    return n;
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      if (!raw) return [];
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }
  function saveHistory(h) {
    try {
      var trimmed = h.slice(-HISTORY_MAX);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(trimmed));
    } catch (e) {}
  }
  function loadViewerUrl() {
    try { return localStorage.getItem(VIEWER_KEY) || ""; } catch (e) { return ""; }
  }
  function saveViewerUrl(u) {
    try { localStorage.setItem(VIEWER_KEY, u); } catch (e) {}
  }

  function isGenericCohort(label) {
    if (!label) return true;
    var s = String(label).trim().toLowerCase();
    return s === "" || s === "total cohort" || s === "total";
  }

  function verdictBadge(verdict) {
    var v = (verdict || "").toLowerCase();
    var cls, glyph;
    if (v === "pass" || v === "ok")             { cls = "ok";   glyph = "✓"; }
    else if (v === "weak" || v === "warn" || v === "partial") { cls = "warn"; glyph = "~"; }
    else if (v === "fail" || v === "reject")    { cls = "fail"; glyph = "✗"; }
    else                                         { cls = "unk";  glyph = "?"; }
    var b = el("span", "badge " + cls, glyph);
    b.title = "verdict: " + (verdict || "unverified");
    b.setAttribute("aria-label", "verdict " + (verdict || "unverified"));
    return b;
  }

  function parseBbox(bbox) {
    if (bbox == null) return null;
    var arr = bbox;
    if (typeof arr === "string") {
      try { arr = JSON.parse(arr); } catch (e) { return null; }
    }
    if (!Array.isArray(arr) || arr.length !== 4) return null;
    var nums = arr.map(function (x) { return Number(x); });
    for (var i = 0; i < 4; i++) {
      if (!isFinite(nums[i])) return null;
    }
    return nums;
  }

  function buildViewerUrl(row) {
    var origin = window.location.origin;
    var stem = row.file_name || "";
    var page = parseInt(row.anchor_page, 10);
    if (!isFinite(page) || page < 1) page = 1;
    var url = origin + "/viewer/" + encodeURIComponent(stem) + "?page=" + page;
    var bbox = parseBbox(row.anchor_bbox);
    if (bbox) {
      url += "&bbox=" + bbox.map(function (v) { return (+v).toFixed(2); }).join(",") + "&origin=tl";
    }
    return url;
  }

  function setViewer(url) {
    if (!url) return;
    viewerEmpty.style.display = "none";
    viewerFrame.style.display = "block";
    if (viewerFrame.src !== url) viewerFrame.src = url;
    saveViewerUrl(url);
  }

  function activateCard(card, row) {
    if (activeCard && activeCard !== card) activeCard.classList.remove("active");
    card.classList.add("active");
    activeCard = card;
    card.classList.add("tap");
    setTimeout(function () { card.classList.remove("tap"); }, 110);
    setViewer(buildViewerUrl(row));
  }

  function makeCard(row) {
    var card = el("div", "card");
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");

    var head = el("div", "card-head");
    var title = el("div", "card-title");
    var paperRef = row.paper_ref || "(unknown paper)";
    var titleText = paperRef;
    if (!isGenericCohort(row.cohort_label)) {
      titleText = paperRef + " · " + row.cohort_label;
    }
    title.textContent = titleText;

    var right = el("div", "card-meta-right");
    var pageNum = parseInt(row.anchor_page, 10);
    if (isFinite(pageNum) && pageNum >= 1) {
      right.appendChild(el("span", "page", "p." + pageNum));
    }
    right.appendChild(verdictBadge(row.verifier_verdict));

    head.appendChild(title);
    head.appendChild(right);
    card.appendChild(head);

    var kv = el("div", "kv");
    var predictor = row.predictor_canonical || row.predictors || "—";
    var outcome = row.outcome || "—";
    var effect = row.effect_size_str || "—";
    var nVal = (row.cohort_size_n == null || row.cohort_size_n === "") ? "—" : String(row.cohort_size_n);

    var pairs = [
      ["Predictor", predictor],
      ["Outcome", outcome],
      ["Effect", effect],
      ["N", nVal]
    ];
    pairs.forEach(function (p) {
      var rowEl = el("div", "row");
      rowEl.appendChild(el("div", "k", p[0]));
      var v = el("div", "v", p[1]);
      v.title = p[1];
      rowEl.appendChild(v);
      kv.appendChild(rowEl);
    });
    card.appendChild(kv);

    if (row.anchor_text && String(row.anchor_text).trim().length > 0) {
      var q = el("div", "quote", String(row.anchor_text));
      card.appendChild(q);
    }

    function activate() { activateCard(card, row); }
    card.addEventListener("click", activate);
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        activate();
      }
    });
    return card;
  }

  function renderAssistant(turnEl, payload) {
    var holder = el("div", "assistant");
    if (payload && payload.refused) {
      var rText = payload.refused_reason || "Request refused.";
      holder.appendChild(el("div", "refused", rText));
      turnEl.appendChild(holder);
      return;
    }
    if (payload && payload.summary) {
      holder.appendChild(el("div", "summary", payload.summary));
    }
    var rows = (payload && Array.isArray(payload.rows)) ? payload.rows : [];
    if (rows.length > 0) {
      var rowsEl = el("div", "rows");
      rows.forEach(function (r) {
        rowsEl.appendChild(makeCard(r));
      });
      holder.appendChild(rowsEl);
    }
    turnEl.appendChild(holder);
  }

  function renderUserBubble(turnEl, text) {
    turnEl.appendChild(el("div", "bubble-user", text));
  }

  function renderTurn(turn) {
    var t = el("div", "turn");
    renderUserBubble(t, turn.user_text || "");
    renderAssistant(t, turn.assistant || {});
    scrollback.appendChild(t);
    return t;
  }

  function makeWelcome() {
    var wrap = el("div", "welcome");
    wrap.appendChild(el("h2", null, "Sepsis Atlas"));
    wrap.appendChild(el("p", null,
      "Ask about sepsis predictors, biomarkers, or outcomes. Answers are pinned to verbatim quotes from peer-reviewed papers; click any evidence row to inspect the cited PDF passage."));
    var chips = el("div", "chips");
    var samples = [
      "lactate and 28-day mortality",
      "qSOFA in septic shock",
      "predictors from Schlapbach 2018"
    ];
    samples.forEach(function (s) {
      var c = el("button", "chip", s);
      c.type = "button";
      c.addEventListener("click", function () {
        input.value = s;
        autoGrow();
        submitQuery();
      });
      chips.appendChild(c);
    });
    wrap.appendChild(chips);
    return wrap;
  }

  function ensureWelcomeOrClear() {
    if (scrollback.children.length === 0) {
      scrollback.appendChild(makeWelcome());
    }
  }

  function clearWelcome() {
    var w = scrollback.querySelector(".welcome");
    if (w) w.remove();
  }

  function scrollToBottom() {
    scrollback.scrollTop = scrollback.scrollHeight;
  }

  function autoGrow() {
    input.style.height = "auto";
    var max = 132;
    var h = Math.min(input.scrollHeight, max);
    input.style.height = h + "px";
  }

  async function submitQuery() {
    var text = input.value.trim();
    if (!text) return;
    if (sendBtn.disabled) return;

    clearWelcome();

    var turnEl = el("div", "turn");
    renderUserBubble(turnEl, text);
    var thinking = el("div", "assistant");
    thinking.appendChild(el("div", "thinking", "thinking..."));
    turnEl.appendChild(thinking);
    scrollback.appendChild(turnEl);
    scrollToBottom();

    input.value = "";
    autoGrow();
    sendBtn.disabled = true;

    var payload;
    try {
      var resp = await fetch("/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nl_text: text })
      });
      if (!resp.ok) {
        var msg = "Request failed: " + resp.status;
        try {
          var errBody = await resp.json();
          if (errBody && errBody.detail) msg = String(errBody.detail);
        } catch (e) {}
        payload = { refused: true, refused_reason: msg, rows: [], summary: "" };
      } else {
        payload = await resp.json();
      }
    } catch (err) {
      payload = { refused: true, refused_reason: "Network error: " + (err && err.message ? err.message : "unknown"), rows: [], summary: "" };
    }

    thinking.remove();
    renderAssistant(turnEl, payload);
    scrollToBottom();

    var hist = loadHistory();
    hist.push({
      user_text: text,
      assistant: {
        summary: payload.summary || "",
        rows: Array.isArray(payload.rows) ? payload.rows : [],
        refused: !!payload.refused,
        refused_reason: payload.refused_reason || null
      },
      ts: Date.now()
    });
    saveHistory(hist);

    sendBtn.disabled = false;
    input.focus();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    submitQuery();
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      submitQuery();
    }
  });
  input.addEventListener("input", autoGrow);

  var clearBtn = document.getElementById("clearBtn");
  if (clearBtn) {
    clearBtn.addEventListener("click", function () {
      try {
        localStorage.removeItem(HISTORY_KEY);
        localStorage.removeItem(VIEWER_KEY);
      } catch (e) {}
      while (scrollback.firstChild) scrollback.removeChild(scrollback.firstChild);
      viewerFrame.removeAttribute("src");
      viewerFrame.style.display = "none";
      viewerEmpty.style.display = "";
      ensureWelcomeOrClear();
      input.value = "";
      autoGrow();
      input.focus();
    });
  }

  // Rehydrate history
  (function init() {
    var hist = loadHistory();
    if (hist.length === 0) {
      ensureWelcomeOrClear();
    } else {
      hist.forEach(renderTurn);
      scrollToBottom();
    }
    var lastUrl = loadViewerUrl();
    if (lastUrl) {
      try {
        var u = new URL(lastUrl);
        if (u.origin === window.location.origin) {
          viewerEmpty.style.display = "none";
          viewerFrame.style.display = "block";
          viewerFrame.src = lastUrl;
        }
      } catch (e) {}
    }
    autoGrow();
    input.focus();
  })();
})();
</script>
</body>
</html>
