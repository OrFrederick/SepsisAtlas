name: deploy main

# On every push to main (except docs-only):
#   1. build + push backend image to ghcr (~30s warm via gha cache when
#      no backend files changed; ~10min cold if the cache is evicted or
#      the Dockerfile changes a layer)
#   2. ssh to VPS and run deploy-main.sh (frontend rebuild + caddy reload)
#
# Watchtower on the VPS polls ghcr every 5 minutes and restarts the
# backend container when a new :main tag lands, so this workflow does
# not need to trigger a backend restart explicitly.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  # Hardcoded lowercase — docker tags reject mixed-case (`OrFrederick`).
  # Keep in sync with `image:` in docker-compose.prod.yml.
  IMAGE: ghcr.io/orfrederick/sepsis-atlas-backend

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # network=host so the buildkit container can reach docker.io when
          # running under `act` on a Colima-backed daemon (isolated network
          # otherwise times out the base-image fetch). Harmless on real CI
          # runners where the host net is already in use.
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build + push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: ssh deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: /opt/sepsisatlas/main/deploy/deploy-main.sh
          script_stop: true
          command_timeout: 10m
