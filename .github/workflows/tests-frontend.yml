name: frontend tests

# Typecheck + vitest for the Next.js app under web/.
# `--ignore-scripts` mirrors the deploy workflow (pdfjs postinstall is noisy
# in CI and the vendor step isn't needed for unit tests).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'web/**'
      - '.github/workflows/tests-frontend.yml'
  push:
    branches: [dev]
    paths:
      - 'web/**'
      - '.github/workflows/tests-frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: typecheck
        run: bun run check

      - name: vitest
        run: bun run test
