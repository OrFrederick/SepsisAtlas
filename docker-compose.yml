# Sepsis Atlas — full demo stack
#
# Brings up:
#   - backend       FastAPI (Agent 3): /query, /viewer, /forest_plot, /ingest_pubmed
#   - openwebui     ghcr.io/open-webui/open-webui:main on :3000
#   - pipelines     ghcr.io/open-webui/pipelines:main with our pipelines/ mount
#   - open_source   FastAPI tool on :9101 (returns iframe HTMLResponse)
#   - meta_analyze  FastAPI tool on :9102
#   - expand_pubmed FastAPI tool on :9103
#
# All services share the `sepsis` network, so containers resolve each other by
# name (the iframe URLs use http://backend:8000/...).
#
# Usage:
#   docker compose up --build
#   open http://localhost:3000
#   then: Admin → Pipelines → connect http://pipelines:9099 (default key 0p3n-w3bu!)
#         Admin → Tools     → register http://open_source:9101/openapi.json
#                                       http://meta_analyze:9102/openapi.json
#                                       http://expand_pubmed:9103/openapi.json
#         Settings → Interface → enable "Allow Iframe Sandbox Same-Origin Access"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sepsis_backend
    environment:
      - DATABASE_URL=sqlite:////app/db.sqlite
      - PYTHONPATH=/app/src
    volumes:
      - ./data:/app/data
      - ./db.sqlite:/app/db.sqlite
      - ./static:/app/static
      - ./runs:/app/runs
      - ./logs:/app/logs
      - ./src:/app/src           # editable mount for hot reload during demo
    ports:
      - "8000:8000"
    networks: [sepsis]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  pipelines:
    image: ghcr.io/open-webui/pipelines:main
    container_name: sepsis_pipelines
    environment:
      - PIPELINES_API_KEY=0p3n-w3bu!
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./pipelines:/app/pipelines
    ports:
      - "9099:9099"
    networks: [sepsis]
    depends_on: [backend]
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: sepsis_openwebui
    environment:
      - WEBUI_AUTH=False                                # demo only
      - WEBUI_AUTH_TRUSTED_IFRAME_ORIGINS=http://backend:8000,http://localhost:8000
      - WEBUI_NAME=Sepsis Atlas
      - WEBUI_BANNERS=[]
      - DEFAULT_LOCALE=en-US
      - DEFAULT_MODELS=sepsis_atlas
      - DEFAULT_PROMPT_SUGGESTIONS=[]
      - ENABLE_SIGNUP=False
      - ENABLE_LOGIN_FORM=False
      - ENABLE_API_KEY=False
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URLS=http://pipelines:9099
      - OPENAI_API_KEYS=0p3n-w3bu!
      # Lockdown: this is a single-purpose demo for the sepsis_atlas pipeline.
      # Disable every feature that doesn't serve that path so users can't
      # upload files, run code, fetch the web, generate images, etc.
      - ENABLE_OLLAMA_API=False
      - ENABLE_CODE_INTERPRETER=False
      - ENABLE_CODE_EXECUTION=False
      - ENABLE_IMAGE_GENERATION=False
      - ENABLE_WEB_SEARCH=False
      - ENABLE_RAG_HYBRID_SEARCH=False
      - ENABLE_RAG_LOCAL_WEB_FETCH=False
      - ENABLE_AUTOCOMPLETE_GENERATION=False
      - ENABLE_TITLE_GENERATION=False
      - ENABLE_TAGS_GENERATION=False
      - ENABLE_FOLLOW_UP_GENERATION=False
      - ENABLE_RETRIEVAL_QUERY_GENERATION=False
      - ENABLE_SEARCH_QUERY_GENERATION=False
      - ENABLE_COMMUNITY_SHARING=False
      - ENABLE_MESSAGE_RATING=False
      - ENABLE_DIRECT_CONNECTIONS=False
      - ENABLE_EVALUATION_ARENA_MODELS=False
      - ENABLE_ADMIN_CHAT_ACCESS=False
      - ENABLE_NOTES=False
      - ENABLE_CHANNELS=False
      - ENABLE_USER_WEBHOOKS=False
      - AUDIO_STT_ENGINE=
      - AUDIO_TTS_ENGINE=
      - USER_PERMISSIONS_CHAT_FILE_UPLOAD=False
      - USER_PERMISSIONS_CHAT_DELETE=False
      - USER_PERMISSIONS_CHAT_EDIT=True
      - USER_PERMISSIONS_CHAT_TEMPORARY=False
      - USER_PERMISSIONS_CHAT_STT=False
      - USER_PERMISSIONS_CHAT_TTS=False
      - USER_PERMISSIONS_CHAT_CALL=False
      - USER_PERMISSIONS_CHAT_MULTIPLE_MODELS=False
      - USER_PERMISSIONS_CHAT_CONTROLS=False
      - USER_PERMISSIONS_CHAT_SYSTEM_PROMPT=False
      - USER_PERMISSIONS_CHAT_PARAMS=False
      - USER_PERMISSIONS_CHAT_VALVES=False
      - USER_PERMISSIONS_FEATURES_CODE_INTERPRETER=False
      - USER_PERMISSIONS_FEATURES_WEB_SEARCH=False
      - USER_PERMISSIONS_FEATURES_IMAGE_GENERATION=False
      - USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS=False
      - USER_PERMISSIONS_FEATURES_NOTES=False
      - USER_PERMISSIONS_FEATURES_PLUGINS=False
      - USER_PERMISSIONS_WORKSPACE_MODELS_ACCESS=False
      - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=False
      - USER_PERMISSIONS_WORKSPACE_PROMPTS_ACCESS=False
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=False
      - USER_PERMISSIONS_SHARING_PUBLIC_MODELS=False
      - USER_PERMISSIONS_SHARING_PUBLIC_KNOWLEDGE=False
      - USER_PERMISSIONS_SHARING_PUBLIC_PROMPTS=False
      - USER_PERMISSIONS_SHARING_PUBLIC_TOOLS=False
      # Some feature flags get cached into webui.db on first boot. Resetting
      # the persistent config on every start keeps the lockdown deterministic.
      - RESET_CONFIG_ON_START=true
    volumes:
      - openwebui_data:/app/backend/data
      - ./static/openwebui-custom.css:/app/build/static/custom.css:ro
    ports:
      - "3000:8080"
    networks: [sepsis]
    depends_on: [pipelines, backend]
    restart: unless-stopped

  open_source:
    build:
      context: .
      dockerfile: docker/Dockerfile.tool
      args:
        TOOL_MODULE: tools.sepsis_atlas.open_source
        TOOL_PORT: "9101"
    container_name: sepsis_tool_open_source
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./tools:/app/tools
    ports:
      - "9101:9101"
    networks: [sepsis]
    depends_on: [backend]
    restart: unless-stopped

  meta_analyze:
    build:
      context: .
      dockerfile: docker/Dockerfile.tool
      args:
        TOOL_MODULE: tools.sepsis_atlas.meta_analyze
        TOOL_PORT: "9102"
    container_name: sepsis_tool_meta_analyze
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./tools:/app/tools
    ports:
      - "9102:9102"
    networks: [sepsis]
    depends_on: [backend]
    restart: unless-stopped

  expand_pubmed:
    build:
      context: .
      dockerfile: docker/Dockerfile.tool
      args:
        TOOL_MODULE: tools.sepsis_atlas.expand_pubmed
        TOOL_PORT: "9103"
    container_name: sepsis_tool_expand_pubmed
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./tools:/app/tools
    ports:
      - "9103:9103"
    networks: [sepsis]
    depends_on: [backend]
    restart: unless-stopped

networks:
  sepsis:
    driver: bridge

volumes:
  openwebui_data:
