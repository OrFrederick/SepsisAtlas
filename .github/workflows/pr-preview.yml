name: pr preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: ssh deploy-pr
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PR_NUMBER,PR_SHA
          script: /opt/sepsisatlas/main/deploy/deploy-pr.sh "$PR_NUMBER" "$PR_SHA"
          script_stop: true
          command_timeout: 20m

      - name: comment preview url
        if: success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            Preview deploying: https://pr-${{ github.event.pull_request.number }}.atlas.efferon.com
            (May take up to a minute for HTTPS to issue on first deploy.)

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: ssh cleanup-pr
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: PR_NUMBER
          script: /opt/sepsisatlas/main/deploy/cleanup-pr.sh "$PR_NUMBER"
          script_stop: true
          command_timeout: 5m
