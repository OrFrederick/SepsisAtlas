name: frontend tests

# Typecheck + vitest for the Next.js app under web/.
#
# bun.lock pins the linux-x64 platform binaries for esbuild and rollup as
# explicit optionalDependencies in web/package.json — without that, bun
# would only record the host-platform binary (darwin-arm64) and the Linux
# runner would fail with either `Cannot find module
# '@rollup/rollup-linux-x64-gnu'` (rollup runtime) or
# `Expected "0.27.7" but got "0.21.5"` (esbuild postinstall sanity check).

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'web/**'
      - '.github/workflows/tests-frontend.yml'
  push:
    branches: [dev]
    paths:
      - 'web/**'
      - '.github/workflows/tests-frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: cache bun deps
        uses: actions/cache@v4
        with:
          path: |
            web/node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run check

      - name: vitest
        run: bun run test
