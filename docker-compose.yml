# Sepsis Atlas — research-shell stack
#
# Single service: backend FastAPI on :8000 serving:
#   /            research-shell SPA (static/app.html) — chat + PDF viewer split
#   /query       NL question → ranked evidence rows
#   /viewer/<s>  PDF.js viewer with bbox highlight
#   /papers/...  raw PDF stream
#
# Usage:
#   docker compose up -d --build
#   open http://localhost:8000
#
# .env at repo root provides OPENROUTER_API_KEY etc — backend reads via env_file.

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sepsis_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/db.sqlite
      - PYTHONPATH=/app/src
      - DISABLE_SEMANTIC_RERANK=1   # keyword fallback; flip off when HF model is pre-warmed
    volumes:
      - ./data:/app/data
      - ./db.sqlite:/app/db.sqlite
      - ./static:/app/static
      - ./runs:/app/runs
      - ./logs:/app/logs
      - ./src:/app/src           # editable mount for hot reload during demo
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
