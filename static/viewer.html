<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sepsis Atlas — PDF viewer</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/web/pdf_viewer.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #FAFAF7;
      --panel: #FFFFFF;
      --panel-2: #F4F1EA;
      --panel-3: #EFEAE0;
      --border: #DDD7C7;
      --border-strong: #BCB39C;
      --fg: #1A1614;
      --fg-soft: #403A33;
      --muted: #6B6258;
      --faint: #8E8576;
      --accent: #0F4C5C;
      --serif: "Iowan Old Style", "Charter", "Source Serif 4", Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    }
    html, body {
      margin: 0; padding: 0;
      background: var(--panel-3); color: var(--fg);
      font: 13px/1.45 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    #toolbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: 6px; align-items: center;
      padding: 5px 12px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      height: 36px;
      box-sizing: border-box;
    }
    #toolbar .sep { width: 1px; height: 16px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
    #toolbar button {
      background: var(--panel); color: var(--fg-soft);
      border: 1px solid var(--border);
      padding: 2px 9px; border-radius: 3px; cursor: pointer;
      font: inherit; font-size: 12px; line-height: 1.4;
      white-space: nowrap; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 4px;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    #toolbar button:hover:not(:disabled) {
      background: var(--panel-2);
      border-color: var(--border-strong);
      color: var(--fg);
    }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #toolbar input {
      background: var(--panel); color: var(--fg);
      border: 1px solid var(--border);
      padding: 2px 6px; border-radius: 3px;
      font: inherit; font-size: 12px; line-height: 1.4;
      box-sizing: border-box; height: 24px;
      font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
    }
    #toolbar input:focus { outline: none; border-color: var(--accent); }
    #pageinput { width: 44px; text-align: center; }
    #pagetotal {
      color: var(--muted);
      font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    #pageinput::-webkit-outer-spin-button,
    #pageinput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #zoominfo {
      color: var(--muted); min-width: 44px; text-align: center;
      font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    #search {
      width: 170px; min-width: 110px;
      flex-shrink: 1;
    }
    #search-info {
      color: var(--muted); min-width: 36px; text-align: right;
      font-feature-settings: "tnum"; font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    #filename {
      color: var(--muted); margin-left: auto;
      font-family: var(--mono); font-size: 12px;
      font-feature-settings: "tnum";
      flex-shrink: 0;
    }
    #status { color: var(--muted); font-style: italic; flex-shrink: 0; }

    #stage {
      display: flex; flex-direction: column; align-items: center;
      padding: 28px 16px 80px;
      gap: 22px;
      background: var(--panel-3);
    }
    .pageWrap {
      position: relative;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(0,0,0,0.02), 0 8px 24px rgba(26, 22, 20, 0.06);
      /* width/height set in JS to viewport CSS pixels */
    }
    .pdfCanvas {
      position: absolute; left: 0; top: 0;
      /* CSS dims set in JS so canvas fills wrapper but renders at devicePixelRatio */
    }
    .textLayer {
      position: absolute; left: 0; top: 0;
      overflow: hidden;
      opacity: 1;
      line-height: 1.0;
      user-select: text;
      forced-color-adjust: none;
    }
    .textLayer ::selection { background: rgba(15, 76, 92, 0.25); }
    .textLayer span, .textLayer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .textLayer span.searchHit {
      background: rgba(255, 226, 92, 0.65);
      border-radius: 1px;
    }
    .textLayer span.searchHit.searchHitActive {
      background: rgba(255, 180, 30, 0.85);
      box-shadow: 0 0 0 1px rgba(204, 110, 16, 0.7);
    }
    .bboxOverlay {
      position: absolute;
      pointer-events: none;
      background: rgba(255, 226, 92, 0.55);
      mix-blend-mode: multiply;
      border-radius: 1px;
      display: none;
      box-shadow: 0 0 0 1px rgba(204, 150, 16, 0.55);
    }
    .pageLabel {
      position: absolute; left: 10px; top: 10px;
      color: var(--faint); font-size: 11px;
      font-family: var(--mono);
      font-feature-settings: "tnum";
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="prev" title="Previous page (←, PageUp)">‹</button>
    <input id="pageinput" type="text" inputmode="numeric" value="—" title="Type a page number, Enter to jump">
    <span id="pagetotal">/ —</span>
    <button id="next" title="Next page (→, PageDown)">›</button>
    <span class="sep"></span>
    <button id="zoomOut" title="Zoom out (-)">−</button>
    <span id="zoominfo">100%</span>
    <button id="zoomIn" title="Zoom in (+)">+</button>
    <button id="fit" title="Fit width">Fit</button>
    <span class="sep"></span>
    <input id="search" type="search" placeholder="Search…" title="Find in PDF (Enter = next, Shift+Enter = previous)">
    <span id="search-info"></span>
    <span class="sep"></span>
    <button id="jumpBbox" title="Jump back to highlight">↩ Highlight</button>
    <button id="openPdf" title="Open PDF in a new tab">Open PDF</button>
    <span id="status"></span>
    <span id="filename">__FILE_STEM__.pdf</span>
  </div>

  <div id="stage"></div>

  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

    // Disable bfcache scroll restoration — otherwise back/forward into the
    // iframe lands at the previous scroll position before our jump runs.
    if ("scrollRestoration" in history) history.scrollRestoration = "manual";

    const FILE_STEM = "__FILE_STEM__";
    const PDF_URL = `/papers/${FILE_STEM}/pdf`;

    const params = new URLSearchParams(location.search);
    const initialPage = Math.max(1, parseInt(params.get("page") || "1", 10));
    const bboxStr = params.get("bbox");
    // origin: 'tl' (Docling tables, OCR-style top-left) or 'bl' (PDF-native bottom-left).
    // These three are mutated by the in-iframe jump handler so the parent can
    // re-target the overlay without forcing a full viewer reload.
    let bboxOrigin = (params.get("origin") || "tl").toLowerCase();
    let bbox = bboxStr ? bboxStr.split(",").map(Number) : null;
    let bboxPage = bbox ? initialPage : null;

    let scale = 1.5;
    let pdfDoc = null;
    let currentPage = initialPage;
    // Tracks whether the user has manually changed scale (zoom buttons or
    // explicit Fit click). Once true, automatic fit-to-width on outer-window
    // resize stops overriding the user's choice.
    let userZoomLocked = false;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);

    const stage = document.getElementById("stage");
    const statusEl = document.getElementById("status");
    const pageInputEl = document.getElementById("pageinput");
    const pageTotalEl = document.getElementById("pagetotal");
    const zoomInfoEl = document.getElementById("zoominfo");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const fitBtn = document.getElementById("fit");
    const jumpBtn = document.getElementById("jumpBbox");
    const openPdfBtn = document.getElementById("openPdf");
    const searchEl = document.getElementById("search");
    const searchInfoEl = document.getElementById("search-info");

    // Per-page state. pages[i] is the entry for page i+1 (1-indexed via .num).
    const pages = [];
    let renderObserver = null;
    let visibilityObserver = null;

    function setStatus(msg) { statusEl.textContent = msg; }

    function buildPageStub(num, viewport) {
      const cssW = Math.floor(viewport.width);
      const cssH = Math.floor(viewport.height);
      const wrap = document.createElement("div");
      wrap.className = "pageWrap";
      wrap.dataset.page = String(num);
      wrap.style.width = `${cssW}px`;
      wrap.style.height = `${cssH}px`;

      const canvas = document.createElement("canvas");
      canvas.className = "pdfCanvas";
      canvas.style.width = `${cssW}px`;
      canvas.style.height = `${cssH}px`;
      wrap.appendChild(canvas);

      const textLayer = document.createElement("div");
      textLayer.className = "textLayer";
      textLayer.style.width = `${cssW}px`;
      textLayer.style.height = `${cssH}px`;
      wrap.appendChild(textLayer);

      const overlay = document.createElement("div");
      overlay.className = "bboxOverlay";
      wrap.appendChild(overlay);

      const label = document.createElement("div");
      label.className = "pageLabel";
      label.textContent = String(num);
      wrap.appendChild(label);

      stage.appendChild(wrap);
      return { num, wrap, canvas, textLayer, overlay, rendered: false, rendering: null, viewport: null };
    }

    async function renderPage(entry) {
      if (!pdfDoc) return;
      if (entry.rendered) return;
      if (entry.rendering) return entry.rendering;

      entry.rendering = (async () => {
        const page = await pdfDoc.getPage(entry.num);
        const viewport = page.getViewport({ scale });
        const cssW = Math.floor(viewport.width);
        const cssH = Math.floor(viewport.height);

        entry.wrap.style.width = `${cssW}px`;
        entry.wrap.style.height = `${cssH}px`;
        entry.canvas.width = Math.floor(cssW * dpr);
        entry.canvas.height = Math.floor(cssH * dpr);
        entry.canvas.style.width = `${cssW}px`;
        entry.canvas.style.height = `${cssH}px`;
        entry.textLayer.style.width = `${cssW}px`;
        entry.textLayer.style.height = `${cssH}px`;

        const ctx = entry.canvas.getContext("2d", { alpha: false });
        const transform = dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null;
        await page.render({ canvasContext: ctx, viewport, transform }).promise;

        entry.textLayer.replaceChildren();
        const textLayer = new pdfjsLib.TextLayer({
          textContentSource: page.streamTextContent(),
          container: entry.textLayer,
          viewport,
        });
        await textLayer.render();

        entry.viewport = viewport;
        drawBbox(entry, viewport);
        // Re-apply current search highlight to this page's freshly built text
        // layer (the old spans were thrown away by replaceChildren above).
        if (searchState.query) highlightPage(entry);
        entry.rendered = true;
      })();

      try { await entry.rendering; }
      finally { entry.rendering = null; }
    }

    function drawBbox(entry, viewport) {
      const overlay = entry.overlay;
      overlay.style.display = "none";
      if (!bbox || bbox.length !== 4 || entry.num !== bboxPage) return;

      let [x0, y0, x1, y1] = bbox;
      if (bboxOrigin === "bl") {
        const pageHeightPts = viewport.height / scale;
        const yMin = Math.min(y0, y1);
        const yMax = Math.max(y0, y1);
        y0 = pageHeightPts - yMax;
        y1 = pageHeightPts - yMin;
      } else if (y0 > y1) {
        [y0, y1] = [y1, y0];
      }
      const left = x0 * scale;
      const top = y0 * scale;
      const w = Math.max(2, (x1 - x0) * scale);
      const h = Math.max(2, (y1 - y0) * scale);
      overlay.style.left = `${left}px`;
      overlay.style.top = `${top}px`;
      overlay.style.width = `${w}px`;
      overlay.style.height = `${h}px`;
      overlay.style.display = "block";
    }

    function scrollToPage(num, opts = {}) {
      const entry = pages[num - 1];
      if (!entry) return;
      entry.wrap.scrollIntoView({ behavior: opts.behavior || "smooth", block: "start" });
    }

    function scrollToBbox(opts = {}) {
      const entry = pages[bboxPage - 1];
      if (!entry || !bbox) return;
      const ensure = entry.rendered ? Promise.resolve() : renderPage(entry);
      ensure.then(() => {
        const overlay = entry.overlay;
        if (overlay.style.display === "none") {
          scrollToPage(bboxPage, opts);
          return;
        }
        const scroller = document.scrollingElement || document.documentElement;
        const wrapRect = entry.wrap.getBoundingClientRect();
        const overlayTop = parseFloat(overlay.style.top) || 0;
        const overlayHeight = parseFloat(overlay.style.height) || 0;
        const targetY = scroller.scrollTop + wrapRect.top + overlayTop
                        - window.innerHeight / 2 + overlayHeight / 2;
        scroller.scrollTo({ top: Math.max(0, targetY), behavior: opts.behavior || "smooth" });
      });
    }

    async function rerenderAll() {
      // Resize stubs, mark un-rendered, kick render for pages near viewport.
      for (const entry of pages) {
        const page = await pdfDoc.getPage(entry.num);
        const viewport = page.getViewport({ scale });
        const cssW = Math.floor(viewport.width);
        const cssH = Math.floor(viewport.height);
        entry.wrap.style.width = `${cssW}px`;
        entry.wrap.style.height = `${cssH}px`;
        entry.canvas.style.width = `${cssW}px`;
        entry.canvas.style.height = `${cssH}px`;
        entry.textLayer.style.width = `${cssW}px`;
        entry.textLayer.style.height = `${cssH}px`;
        entry.rendered = false;
      }
      zoomInfoEl.textContent = `${Math.round(scale / 1.5 * 100)}%`;
      // Force re-observation so visible pages re-render at new scale.
      if (renderObserver) {
        for (const entry of pages) {
          renderObserver.unobserve(entry.wrap);
          renderObserver.observe(entry.wrap);
        }
      }
    }

    function fitWidth() {
      if (!pdfDoc || !pages[0]) return;
      pdfDoc.getPage(1).then(page => {
        const baseViewport = page.getViewport({ scale: 1 });
        const available = stage.clientWidth - 32;
        scale = Math.max(0.5, Math.min(4, available / baseViewport.width));
        rerenderAll();
      });
    }

    function setupObservers() {
      renderObserver = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          const num = parseInt(e.target.dataset.page, 10);
          const entry = pages[num - 1];
          if (entry) renderPage(entry);
        }
      }, { rootMargin: "600px 0px 600px 0px" });

      visibilityObserver = new IntersectionObserver((entries) => {
        // Track most-visible page to drive pageinfo + nav buttons.
        let best = null;
        for (const e of entries) {
          if (!e.isIntersecting) continue;
          if (!best || e.intersectionRatio > best.intersectionRatio) best = e;
        }
        if (!best) return;
        const num = parseInt(best.target.dataset.page, 10);
        if (!Number.isFinite(num) || num === currentPage) return;
        currentPage = num;
        updateNavUi();
      }, { threshold: [0.25, 0.5, 0.75] });

      for (const entry of pages) {
        renderObserver.observe(entry.wrap);
        visibilityObserver.observe(entry.wrap);
      }
    }

    function updateNavUi() {
      pageTotalEl.textContent = `/ ${pdfDoc.numPages}`;
      // Only refresh the input value when the input is not focused, so a
      // mid-typing page number isn't clobbered by the visibility observer.
      if (document.activeElement !== pageInputEl) {
        pageInputEl.value = String(currentPage);
      }
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= pdfDoc.numPages;
    }

    // ---- search ---------------------------------------------------------
    // Lightweight in-PDF search built on top of the rendered text layers.
    // We tokenise each page on demand (cached in `pageText`) into spans +
    // string positions, walk the lowercase string for the query, then mark
    // the corresponding spans with .searchHit. The active match also gets
    // .searchHitActive and is scrolled into view.
    const searchState = {
      query: "",
      hits: [],          // [{ page, spans: [span,...] }, ...] absolute order
      activeIdx: -1,
    };
    const pageText = new Map(); // page num -> { lower, spans, spanStarts, spanEnds }

    function ensurePageTextIndex(entry) {
      if (pageText.has(entry.num)) return pageText.get(entry.num);
      const spans = Array.from(entry.textLayer.querySelectorAll("span"));
      let text = "";
      const spanStarts = [];
      const spanEnds = [];
      for (const s of spans) {
        spanStarts.push(text.length);
        text += s.textContent;
        spanEnds.push(text.length);
        text += " ";
      }
      const rec = { lower: text.toLowerCase(), spans, spanStarts, spanEnds };
      pageText.set(entry.num, rec);
      return rec;
    }

    function clearHighlights() {
      for (const hit of searchState.hits) {
        for (const s of hit.spans) {
          s.classList.remove("searchHit", "searchHitActive");
        }
      }
      searchState.hits = [];
      searchState.activeIdx = -1;
      searchInfoEl.textContent = "";
    }

    function highlightPage(entry) {
      // Re-derives matches for this page (used when a page re-renders).
      const q = searchState.query;
      if (!q) return;
      // Drop existing hits for this page so we can rebuild them.
      searchState.hits = searchState.hits.filter(h => h.page !== entry.num);
      pageText.delete(entry.num);
      const rec = ensurePageTextIndex(entry);
      if (!rec) return;
      const lower = rec.lower;
      let from = 0;
      while (true) {
        const i = lower.indexOf(q, from);
        if (i < 0) break;
        const end = i + q.length;
        const spans = [];
        for (let k = 0; k < rec.spans.length; k++) {
          if (rec.spanEnds[k] > i && rec.spanStarts[k] < end) {
            spans.push(rec.spans[k]);
            rec.spans[k].classList.add("searchHit");
          }
        }
        if (spans.length) searchState.hits.push({ page: entry.num, spans });
        from = i + Math.max(1, q.length);
      }
      // Keep hits sorted by page so navigation is deterministic.
      searchState.hits.sort((a, b) => a.page - b.page);
    }

    async function runSearch(q) {
      clearHighlights();
      searchState.query = q;
      if (!q) return;
      // Render every page so each text layer exists for the substring scan.
      // Pages render lazily under normal scrolling; for search we force them.
      setStatus("searching…");
      for (const entry of pages) {
        if (!entry.rendered) await renderPage(entry);
        highlightPage(entry);
      }
      setStatus("");
      if (searchState.hits.length === 0) {
        searchInfoEl.textContent = "0";
        return;
      }
      gotoHit(0);
    }

    function gotoHit(idx) {
      if (searchState.hits.length === 0) return;
      const wrapped = (idx + searchState.hits.length) % searchState.hits.length;
      // Deactivate previous active hit.
      if (searchState.activeIdx >= 0) {
        const prev = searchState.hits[searchState.activeIdx];
        for (const s of prev.spans) s.classList.remove("searchHitActive");
      }
      const hit = searchState.hits[wrapped];
      for (const s of hit.spans) s.classList.add("searchHitActive");
      searchState.activeIdx = wrapped;
      searchInfoEl.textContent = `${wrapped + 1}/${searchState.hits.length}`;
      // Scroll the active hit into view.
      const span = hit.spans[0];
      if (span && span.scrollIntoView) {
        span.scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }

    async function init() {
      try {
        setStatus("loading…");
        pdfDoc = await pdfjsLib.getDocument({
          url: PDF_URL,
          cMapUrl: "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/",
          cMapPacked: true,
        }).promise;

        // Build all page stubs sized correctly so total scroll height is right immediately.
        // Initial scale fits page 1 to the viewer width — avoids the iframe overflowing
        // when the chat shell embeds it in a narrow split.
        const total = pdfDoc.numPages;
        const firstPage = await pdfDoc.getPage(1);
        const baseViewport = firstPage.getViewport({ scale: 1 });
        const available = Math.max(stage.clientWidth - 32, 240);
        scale = Math.max(0.5, Math.min(4, available / baseViewport.width));
        for (let n = 1; n <= total; n++) {
          const page = n === 1 ? firstPage : await pdfDoc.getPage(n);
          const viewport = page.getViewport({ scale });
          pages.push(buildPageStub(n, viewport));
        }

        currentPage = Math.min(initialPage, total);
        updateNavUi();
        zoomInfoEl.textContent = `${Math.round(scale / 1.5 * 100)}%`;
        jumpBtn.style.display = bbox ? "" : "none";

        setupObservers();
        setStatus("");

        // Capture the target page in a local before observers can clobber
        // currentPage. Render synchronously, then double-rAF + a 250ms retry
        // so layout settles even if neighbour pages render in between and
        // shift the scroll target.
        const targetPage = currentPage;
        const target = pages[targetPage - 1];
        if (target) {
          await renderPage(target);
          const jump = () => {
            if (bbox && targetPage === bboxPage) scrollToBbox({ behavior: "auto" });
            else scrollToPage(targetPage, { behavior: "auto" });
          };
          requestAnimationFrame(() => requestAnimationFrame(() => {
            jump();
            setTimeout(jump, 250);
          }));
        }

        try {
          window.parent.postMessage(
            { type: "sepsis-atlas:viewer-ready", file: FILE_STEM, page: currentPage },
            "*"
          );
        } catch (_) {}
      } catch (err) {
        setStatus("Error: " + err.message);
        console.error(err);
      }
    }

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) scrollToPage(currentPage - 1);
    });
    nextBtn.addEventListener("click", () => {
      if (pdfDoc && currentPage < pdfDoc.numPages) scrollToPage(currentPage + 1);
    });
    document.getElementById("zoomIn").addEventListener("click", () => {
      userZoomLocked = true;
      scale = Math.min(4, scale * 1.2); rerenderAll();
    });
    document.getElementById("zoomOut").addEventListener("click", () => {
      userZoomLocked = true;
      scale = Math.max(0.5, scale / 1.2); rerenderAll();
    });
    fitBtn.addEventListener("click", () => {
      userZoomLocked = false;
      fitWidth();
    });
    jumpBtn.addEventListener("click", scrollToBbox);
    openPdfBtn.addEventListener("click", () => {
      window.open(PDF_URL, "_blank", "noopener");
    });

    // Page-number input: jump on Enter / blur. Keep input editable freely
    // while the user types — updateNavUi() only writes the input value when
    // it doesn't currently have focus.
    function commitPageInput() {
      const v = parseInt(pageInputEl.value, 10);
      if (!Number.isFinite(v) || !pdfDoc) { pageInputEl.value = String(currentPage); return; }
      const n = Math.max(1, Math.min(pdfDoc.numPages, v));
      pageInputEl.value = String(n);
      if (n !== currentPage) {
        currentPage = n;
        updateNavUi();
        scrollToPage(n);
      }
    }
    pageInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); commitPageInput(); pageInputEl.blur(); }
      else if (e.key === "Escape") { pageInputEl.value = String(currentPage); pageInputEl.blur(); }
    });
    pageInputEl.addEventListener("blur", commitPageInput);
    pageInputEl.addEventListener("focus", () => pageInputEl.select());

    // Search input. Live filter on input (debounced); Enter / Shift+Enter
    // navigates between hits.
    let searchTimer = 0;
    searchEl.addEventListener("input", () => {
      clearTimeout(searchTimer);
      const q = searchEl.value.trim().toLowerCase();
      searchTimer = window.setTimeout(() => {
        if (q === searchState.query) return;
        if (q.length === 0) { clearHighlights(); searchState.query = ""; return; }
        runSearch(q);
      }, 220);
    });
    searchEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (searchState.hits.length === 0) return;
        gotoHit(searchState.activeIdx + (e.shiftKey ? -1 : 1));
      } else if (e.key === "Escape") {
        searchEl.value = "";
        clearHighlights();
        searchState.query = "";
        searchEl.blur();
      }
    });

    // Outer-window resize: refit page width unless the user has manually
    // zoomed. We listen on `window` (not a ResizeObserver on `stage`) so
    // zoom-induced layout changes don't trigger an unwanted re-fit.
    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      if (!pdfDoc || userZoomLocked) return;
      clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(fitWidth, 120);
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      // Don't swallow browser's native Ctrl+F.
      if (e.ctrlKey || e.metaKey) {
        if (e.key === "f" || e.key === "F") {
          e.preventDefault();
          searchEl.focus();
          searchEl.select();
        }
        return;
      }
      if ((e.key === "ArrowLeft" || e.key === "PageUp") && currentPage > 1) {
        e.preventDefault();
        scrollToPage(currentPage - 1);
      } else if ((e.key === "ArrowRight" || e.key === "PageDown") && pdfDoc && currentPage < pdfDoc.numPages) {
        e.preventDefault();
        scrollToPage(currentPage + 1);
      } else if (e.key === "+" || e.key === "=") {
        userZoomLocked = true;
        scale = Math.min(4, scale * 1.2); rerenderAll();
      } else if (e.key === "-") {
        userZoomLocked = true;
        scale = Math.max(0.5, scale / 1.2); rerenderAll();
      } else if (e.key === "0") {
        userZoomLocked = false;
        scale = 1.5; rerenderAll();
      }
    });

    // Parent (SplitShell) sends { type: "sepsis-atlas:jump", page, bbox, origin }
    // when the user clicks another evidence row for the SAME paper, so we
    // re-target the overlay + scroll without tearing down the PDF.
    // If the click arrives before init() finishes loading the PDF, we buffer
    // the latest request and flush it once `pdfDoc` is ready.
    let pendingJump = null;
    function applyJump(data) {
      const total = pdfDoc.numPages;
      const nextPage = Math.max(1, Math.min(total, parseInt(data.page, 10) || 1));
      let nextBbox = null;
      if (Array.isArray(data.bbox) && data.bbox.length === 4) {
        nextBbox = data.bbox.map(Number);
      } else if (typeof data.bbox === "string" && data.bbox.length > 0) {
        const parts = data.bbox.split(",").map(Number);
        if (parts.length === 4 && parts.every(Number.isFinite)) nextBbox = parts;
      }
      bbox = nextBbox;
      bboxPage = nextBbox ? nextPage : null;
      if (typeof data.origin === "string") bboxOrigin = data.origin.toLowerCase();

      // Repaint every already-rendered page so the old overlay is cleared
      // and the new one shows up on `bboxPage`.
      for (const entry of pages) {
        if (entry.rendered && entry.viewport) drawBbox(entry, entry.viewport);
      }

      jumpBtn.style.display = bbox ? "" : "none";

      const target = pages[nextPage - 1];
      if (!target) return;
      const ensure = target.rendered ? Promise.resolve() : renderPage(target);
      ensure.then(() => {
        currentPage = nextPage;
        updateNavUi();
        if (bbox && bboxPage === nextPage) scrollToBbox({ behavior: "smooth" });
        else scrollToPage(nextPage, { behavior: "smooth" });
      });
    }
    window.addEventListener("message", (e) => {
      const data = e.data;
      if (!data || data.type !== "sepsis-atlas:jump") return;
      if (!pdfDoc) { pendingJump = data; return; }
      applyJump(data);
    });

    init().then(() => {
      if (pendingJump) {
        const p = pendingJump;
        pendingJump = null;
        applyJump(p);
      }
    });
  </script>
</body>
</html>
